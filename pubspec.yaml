name: copilot
description: "Decision copilot foundations for sports bettors."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.3
  get_it: ^9.2.1
  go_router: ^17.3.0
  intl: 0.20.2
  supabase_flutter: ^2.16.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  assets:
    - assets/snapshots/
  uses-material-design: true
