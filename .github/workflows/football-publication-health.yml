name: Football collection and publication health

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lector-football-publication-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require an immutable reviewed release revision
        env:
          LECTOR_RELEASE_REF: ${{ vars.LECTOR_RELEASE_REF }}
        run: '[[ "$LECTOR_RELEASE_REF" =~ ^[a-fA-F0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.LECTOR_RELEASE_REF }}
      - name: Check football batches, coverage and publication age
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 tool/sports/check_football_publication_health.py --remote-readonly
