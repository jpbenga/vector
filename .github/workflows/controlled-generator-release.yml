name: Controlled Generator release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Install the reviewed backend, activate the single test account, or disable canary access
        required: true
        type: choice
        default: install
        options: [install, activate, disable, build, verify-catalogue, install-freshness, activate-freshness, disable-freshness]
      revision:
        description: Exact reviewed main SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: supabase-football-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.operation != 'build' && inputs.operation != 'verify-catalogue'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: supabase/setup-cli@v1
        if: inputs.operation == 'install' || inputs.operation == 'activate' || inputs.operation == 'install-freshness' || inputs.operation == 'activate-freshness'
        with:
          version: '2.120.0'
      - name: Publish only the reviewed canary backend without model calls
        if: inputs.operation == 'install' || inputs.operation == 'activate' || inputs.operation == 'disable'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          LECTOR_APPROVED_RELEASE: ${{ inputs.revision }}
          LECTOR_RELEASE_OPERATION: ${{ inputs.operation }}
        run: python3 tool/deploy_controlled_generator_release.py
      - name: Publish or activate the separately approved European collector supplement
        if: contains(inputs.operation, '-freshness')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          LECTOR_APPROVED_RELEASE: ${{ inputs.revision }}
          LECTOR_RELEASE_OPERATION: ${{ inputs.operation }}
        run: python3 tool/deploy_european_freshness_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-generator-release-${{ inputs.operation }}
          path: |
            controlled-generator-release-receipt.json
            controlled-generator-workshop-rollback.tar.gz
            european-freshness-release-receipt.json
          if-no-files-found: ignore
          retention-days: 30
  verify-catalogue:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'verify-catalogue'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compare public app and server tool catalogues without AI calls
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LECTOR_APPROVED_RELEASE: ${{ inputs.revision }}
        run: python3 tool/check_generator_catalogue_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogue-parity-results
          path: catalogue-parity-results.json
          if-no-files-found: ignore
          retention-days: 30
  build:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile immutable release with public configuration only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          LECTOR_APPROVED_RELEASE: ${{ inputs.revision }}
        run: python3 tool/build_controlled_release_remote.py
      - uses: actions/upload-artifact@v4
        with:
          name: controlled-release-web
          path: build/controlled-release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
