name: Controlled Generator release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Install the reviewed backend, activate the single test account, or disable canary access
        required: true
        type: choice
        default: install
        options: [install, activate, disable]
      revision:
        description: Exact reviewed main SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: supabase-football-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: supabase/setup-cli@v1
        if: inputs.operation == 'install'
        with:
          version: '2.120.0'
      - name: Publish only the reviewed canary backend without model calls
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          LECTOR_APPROVED_RELEASE: ${{ inputs.revision }}
          LECTOR_RELEASE_OPERATION: ${{ inputs.operation }}
        run: python3 tool/deploy_controlled_generator_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-generator-release-${{ inputs.operation }}
          path: controlled-generator-release-receipt.json
          if-no-files-found: ignore
          retention-days: 30
