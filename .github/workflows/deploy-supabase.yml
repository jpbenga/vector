name: Deploy Supabase

on:
  workflow_dispatch:
    inputs:
      function:
        description: Football depuis main ; Générateur depuis la branche démo
        required: true
        default: sync-live-matches
        type: choice
        options:
          - sync-live-matches
          - api-football-sync
          - build-match-feed-snapshot
          - analyze-match-feed-snapshot
          - publish-reading-announcements
          - daily-football-sync
          - ops-worker
          - sync-match-results
          - admin-ops
          - all-football
          - lector-generator-demo
          - lector-generator-update
          - lector-generator-diagnostic

permissions:
  contents: read
  actions: read

concurrency:
  group: supabase-football-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.function != 'lector-generator-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy tested football functions without local keychain
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_FUNCTION: ${{ inputs.function }}
        run: python3 tool/deploy_supabase_remote.py

  generator-demo:
    if: github.ref == 'refs/heads/codex/multisport-hockey' && (inputs.function == 'lector-generator-demo' || inputs.function == 'lector-generator-update')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: lector-generator-demo-install
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          # A fixed release avoids the unauthenticated "latest" lookup limit.
          version: '2.120.0'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install and test only the generator backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GENERATOR_UPDATE: ${{ inputs.function == 'lector-generator-update' && 'true' || 'false' }}
        run: python3 tool/deploy_generator_remote.py

  generator-diagnostic:
    if: github.ref == 'refs/heads/codex/multisport-hockey' && inputs.function == 'lector-generator-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Inspect the reported generator incident without paid calls
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 tool/diagnose_generator_remote.py
