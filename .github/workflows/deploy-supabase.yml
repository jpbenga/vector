name: Controlled generator exploration pilot (no deployment)
run-name: Read pilot artifacts — zero model calls
on:
  workflow_dispatch:
    inputs:
      function:
        description: Read-only artifact recovery; paid pilot already completed
        type: choice
        options: [lector-football-cards-diagnostic]
        default: lector-football-cards-diagnostic
        required: true
      diagnostic_since:
        description: Explicit one-run authorization marker
        type: string
        required: true
        default: ''
permissions:
  contents: read
concurrency:
  group: generator-exploration-pilot-20261013
  cancel-in-progress: false
jobs:
  artifact-review:
    if: github.ref == 'refs/heads/codex/generator-pilot-20261013' && inputs.function == 'lector-football-cards-diagnostic' && inputs.diagnostic_since == 'read-only-pilot-38462876424'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generator-exploration-validation-38462876424
          path: output/pilot-import
          run-id: '38462876424'
          github-token: ${{ github.token }}
      - name: Read archived measurements and export existing checkpoints, zero model calls
        run: python3 tool/read_generator_pilot_artifacts.py
