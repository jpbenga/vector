name: Deploy Supabase

on:
  workflow_dispatch:
    inputs:
      function:
        description: Football depuis main ; Générateur depuis la branche démo
        required: true
        default: sync-live-matches
        type: choice
        options:
          - sync-live-matches
          - api-football-sync
          - build-match-feed-snapshot
          - analyze-match-feed-snapshot
          - publish-reading-announcements
          - daily-football-sync
          - ops-worker
          - sync-match-results
          - admin-ops
          - all-football
          - lector-generator-demo
          - lector-generator-update
          - lector-generator-diagnostic
          - lector-generator-workshop
          - lector-generator-radar-update
          - lector-generator-sport-publications
          - lector-generator-hockey-odds
          - lector-generator-conversation-update
          - lector-generator-configuration-update
          - lector-generator-match-evaluation
          - lector-generator-day-sources
          - lector-visual-live-update
      diagnostic_since:
        description: Début du diagnostic en ISO 8601 avec fuseau (facultatif)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: supabase-football-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && !startsWith(inputs.function, 'lector-generator-') && inputs.function != 'lector-visual-live-update'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy tested football functions without local keychain
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_FUNCTION: ${{ inputs.function }}
        run: python3 tool/deploy_supabase_remote.py

  generator-demo:
    if: github.ref == 'refs/heads/codex/multisport-hockey' && (inputs.function == 'lector-generator-demo' || inputs.function == 'lector-generator-update' || inputs.function == 'lector-generator-workshop')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: lector-generator-demo-install
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          # A fixed release avoids the unauthenticated "latest" lookup limit.
          version: '2.120.0'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install and test only the generator backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GENERATOR_WORKSHOP: ${{ inputs.function == 'lector-generator-workshop' && 'true' || 'false' }}
          GENERATOR_UPDATE: ${{ inputs.function == 'lector-generator-update' && 'true' || 'false' }}
        run: python3 tool/deploy_generator_remote.py
      - name: Preserve the demo model evaluation
        if: always() && inputs.function == 'lector-generator-workshop'
        uses: actions/upload-artifact@v4
        with:
          name: lector-generator-model-comparison
          path: /tmp/lector-generator-comparison.json
          if-no-files-found: ignore
          retention-days: 14

  generator-radar-update:
    if: github.ref == 'refs/heads/codex/multisport-hockey' && inputs.function == 'lector-generator-radar-update'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: '2.120.0'
      - name: Update only demo Radar scope without paid model calls
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/deploy_generator_scope_remote.py

  generator-diagnostic:
    if: github.ref == 'refs/heads/codex/multisport-hockey' && inputs.function == 'lector-generator-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Inspect the reported generator incident without paid calls
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GENERATOR_DIAGNOSTIC_SINCE: ${{ inputs.diagnostic_since }}
        run: python3 tool/diagnose_generator_remote.py

  sport-publications:
    if: github.ref == 'refs/heads/codex/multisport-hockey' && inputs.function == 'lector-generator-sport-publications'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: '2.120.0'
      - name: Connect public sport publications to the demo Generator
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/deploy_sport_publications_remote.py

  hockey-odds:
    if: github.ref == 'refs/heads/codex/multisport-hockey' && inputs.function == 'lector-generator-hockey-odds'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: '2.120.0'
      - name: Install hockey prices and demo conversation continuity
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/deploy_hockey_odds_remote.py

  generator-conversation-update:
    if: github.ref == 'refs/heads/codex/multisport-hockey' && inputs.function == 'lector-generator-conversation-update'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: '2.120.0'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check conversation continuity with GPT-6 Luna on synthetic publications
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: deno run --allow-env=OPENAI_API_KEY,GITHUB_ACTIONS --allow-net=api.openai.com --allow-write=/tmp/lector-generator-conversation.json tool/evaluate_generator_conversation.ts
      - name: Preserve conversation evaluation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lector-generator-conversation-evaluation
          path: /tmp/lector-generator-conversation.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Update only the demo conversation with read capabilities
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/deploy_generator_conversation_remote.py

  generator-configuration-update:
    if: github.ref == 'refs/heads/codex/multisport-hockey' && inputs.function == 'lector-generator-configuration-update'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: '2.120.0'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify request constraints without paid model calls
        run: deno test --no-lock --allow-env supabase/functions/_shared/generator
      - name: Update only the demo conversation function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/deploy_generator_conversation_remote.py

  generator-match-evaluation:
    if: github.ref == 'refs/heads/codex/multisport-hockey' && inputs.function == 'lector-generator-match-evaluation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: '2.120.0'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Evaluate every one of 500 synthetic matches with GPT-6 Luna
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: deno run --allow-env=OPENAI_API_KEY,GITHUB_ACTIONS --allow-net=api.openai.com --allow-write=/tmp/lector-generator-matches.json tool/evaluate_generator_matches.ts
      - name: Preserve match evaluations and actual model receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lector-generator-matches-evaluation
          path: /tmp/lector-generator-matches.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Update only the demo Generator after the exact revision passes CI
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/deploy_generator_conversation_remote.py

  generator-day-sources:
    if: github.ref == 'refs/heads/codex/multisport-hockey' && inputs.function == 'lector-generator-day-sources'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: '2.120.0'
      - name: Install and check paged public day reads without paid model calls
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/deploy_generator_day_sources_remote.py

  visual-live-update:
    if: github.ref == 'refs/heads/codex/multisport-hockey' && inputs.function == 'lector-visual-live-update'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: '2.120.0'
      - name: Install recorded Radar evidence and bounded hockey events
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/deploy_lector_visual_live_remote.py
