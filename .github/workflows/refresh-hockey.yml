name: Refresh hockey publications

on:
  workflow_call:
    inputs:
      operation:
        type: string
        default: refresh
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
  schedule:
    - cron: '35 0,12 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Install once, refresh seven leagues, or republish verified delivery
        type: choice
        default: refresh
        options: [install, refresh, delivery-only]

env:
  LECTOR_REMOTE_WRITES_ENABLED: ${{ vars.LECTOR_REMOTE_WRITES_ENABLED }}

permissions:
  contents: read
  actions: read

concurrency:
  group: lector-full-hockey-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.LECTOR_REMOTE_WRITES_ENABLED == 'true' && (github.event_name != 'schedule' || vars.LECTOR_HOCKEY_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    # The first cold run also builds several years of H2H event history.
    timeout-minutes: 60
    steps:
      - name: Require an immutable reviewed collector revision
        env:
          LECTOR_RELEASE_REF: ${{ vars.LECTOR_RELEASE_REF }}
        run: '[[ "$LECTOR_RELEASE_REF" =~ ^[a-fA-F0-9]{40}$ ]]'
      # Keep collection paused until backup/restore and publication are approved.
      # Pin the collector to the same reviewed main revision as the application.
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.LECTOR_RELEASE_REF }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        if: inputs.operation == 'install'
        with:
          version: '2.120.0'
      - uses: subosito/flutter-action@v2
        if: inputs.operation != 'install'
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Install Dart dependencies
        if: inputs.operation != 'install'
        run: flutter pub get
      - uses: actions/cache/restore@v4
        if: inputs.operation != 'install'
        with:
          path: var/sports/hockey/enrichment-cache
          key: hockey-enrichment-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: hockey-enrichment-v1-${{ runner.os }}-
      - name: Install reviewed collector and atomic delivery RPC
        if: inputs.operation == 'install'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/refresh_hockey_remote.py --install
      - name: Collect, prepare readings, verify and publish hockey
        if: inputs.operation != 'install'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DELIVERY_ONLY: ${{ inputs.operation == 'delivery-only' && 'true' || 'false' }}
        run: |
          if [ "$DELIVERY_ONLY" = true ]; then
            python3 tool/refresh_hockey_remote.py --delivery-only
          else
            python3 tool/refresh_hockey_remote.py
          fi
      - name: Preserve publication verification receipt
        if: always() && inputs.operation != 'install'
        uses: actions/upload-artifact@v4
        with:
          name: hockey-refresh-receipt
          path: hockey-refresh-receipt.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify fourteen current day heads and publication freshness
        if: success() && inputs.operation != 'install'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 tool/sports/check_hockey_publication_health.py --remote-readonly
      # Preserve validated provider responses even if a later publication
      # check fails. Credentials are outside this directory.
      - uses: actions/cache/save@v4
        if: always() && inputs.operation != 'install' && hashFiles('var/sports/hockey/enrichment-cache/**') != ''
        with:
          path: var/sports/hockey/enrichment-cache
          key: hockey-enrichment-v1-${{ runner.os }}-${{ github.run_id }}
