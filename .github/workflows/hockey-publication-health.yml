name: Hockey publication freshness

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lector-hockey-publication-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require an immutable reviewed release revision
        env:
          LECTOR_RELEASE_REF: ${{ vars.LECTOR_RELEASE_REF }}
        run: '[[ "$LECTOR_RELEASE_REF" =~ ^[a-fA-F0-9]{40}$ ]]'
      # Install this scheduling file on main only after production approval.
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.LECTOR_RELEASE_REF }}
      - name: Read publication metadata and alert before the 36-hour limit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 tool/sports/check_hockey_publication_health.py --remote-readonly
