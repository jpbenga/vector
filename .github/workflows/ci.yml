name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/multisport-hockey

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  supabase-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Supabase reading policies
        run: >-
          deno test
          --allow-read=test/fixtures/sports/hockey_meeting_phases.json,lib/features/matches/domain/odds_normalization.dart
          --allow-env=FEED_DELIVERY_ENABLED,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_URL,API_FOOTBALL_KEY,API_FOOTBALL_SYNC_SECRET,API_FOOTBALL_BASE_URL,API_FOOTBALL_REQUEST_DELAY_MS
          supabase/functions/_shared

      - name: Test Bilan SQL migration
        run: deno test --node-modules-dir=none --no-lock --allow-read test/backend/lector_generator_sql_test.ts test/backend/generator_radar_scope_sql_test.ts test/backend/shared_sport_publications_sql_test.ts test/backend/hockey_market_quotes_sql_test.ts test/backend/generator_decisions_sql_test.ts test/backend/feed_delivery_sql_test.ts test/backend/reading_bilan_sql_test.ts test/backend/live_match_sql_test.ts test/backend/sport_feed_sql_test.ts test/backend/hockey_live_sql_test.ts test/backend/form_radar_match_sql_test.ts

      - name: Test remote deployment guards
        run: python3 -m unittest discover -s tool/tests -p 'test_deploy*remote.py'

      - name: Test historical demo publications
        run: deno test --allow-read --allow-write tool/tests/feed_delivery_demo_test.ts
